<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; color: #0f172a; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { margin-bottom: 8px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
    input, select { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #cbd5e1; border-radius: 5px; }
    button { padding: 5px 10px; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
    button.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    .status { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; background: #f1f5f9; margin-bottom: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; }
    .dot.connected { background: #10b981; } .dot.connecting { background: #f59e0b; }
    .dot.rejected, .dot.unconfigured { background: #e11d48; }
    .muted { color: #64748b; font-size: 12px; } .err { color: #be123c; font-size: 12px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .box { border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warn { background: #fffbeb; border-color: #fcd34d; }
  </style>
</head>
<body>
  <h1>Workana submitter <span id="acctLabel" class="muted"></span></h1>
  <div class="status"><span id="dot" class="dot"></span><span id="status">…</span></div>
  <div id="statusErr" class="err row"></div>

  <div class="box grid">
    <div><label>Today</label><span id="today">0</span> sent</div>
    <div><label>Mode</label>
      <select id="mode">
        <option value="fill_only">fill_only (you click send)</option>
        <option value="auto_submit">auto_submit</option>
      </select>
    </div>
  </div>

  <div id="taskBox" class="box warn" style="display:none">
    <label>Current submission</label>
    <div id="task" class="row"></div>
    <div class="muted row">If the page can't confirm success automatically, confirm here after checking Workana:</div>
    <div class="actions"><button id="markSent">Mark sent</button><button id="markFailed">Mark failed</button></div>
  </div>

  <div class="row muted" id="last">No submissions yet.</div>

  <div class="box">
    <label>Workana messages &amp; notifications</label>
    <div class="row" id="watchInfo">Not checked yet.</div>
    <label style="display:flex;gap:6px;align-items:center;text-transform:none;font-weight:400;color:#0f172a">
      <input type="checkbox" id="watchInbox" style="width:auto" /> Keep a Workana inbox tab open (pinned) for alerts
    </label>
    <div class="actions" style="margin-top:6px"><button id="checkNow">Check now</button></div>
    <div class="row muted" id="checkResult"></div>
  </div>

  <div class="box">
    <div class="row"><label>Account ID (must match the dashboard)</label><input id="accountId" placeholder="e.g. friend_a" /></div>
    <div class="row"><label>Workana display name (optional, for wrong-account check)</label><input id="expectedName" /></div>
    <div class="row"><label>Hub URL</label><input id="hubUrl" placeholder="ws://127.0.0.1:8766/ws/ext" /></div>
    <div class="row"><label>Shared secret (HUB_SHARED_SECRET)</label><input id="token" type="password" /></div>
    <div class="actions"><button class="primary" id="save">Save</button><button id="reconnect">Reconnect</button></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
